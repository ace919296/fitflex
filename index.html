<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FitFlex - Apple Style Gym Companion</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            apple: {
              bg: '#F2F2F7',      // iOS 经典浅灰背景
              card: '#FFFFFF',    // 纯白圆角卡片
              blue: '#007AFF',    // Apple 经典科技蓝
              gray: '#8E8E93',    // iOS 辅助灰
              lightGray: '#E5E5EA',
              border: '#E5E5EA'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Chart.js & Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #F2F2F7;
      color: #1C1C1E;
      -webkit-tap-highlight-color: transparent;
    }
    .apple-glass {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto relative antialiased pb-28">

  <!-- 顶部 Header -->
  <header class="px-5 pt-4 pb-2 flex justify-between items-center bg-[#F2F2F7] sticky top-0 z-30">
    <div>
      <h1 class="text-2xl font-black tracking-tight text-black">FitFlex</h1>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="alert('搜索功能暂未开放')" class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-apple-blue shadow-sm border border-apple-border">
        <i data-lucide="search" class="w-4 h-4"></i>
      </button>
      <button onclick="openAddModal()" class="w-8 h-8 rounded-full bg-apple-blue flex items-center justify-center text-white shadow-sm active:scale-90 transition-transform">
        <i data-lucide="plus" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- 主内容切换区 -->
  <main class="flex-1 px-4">

    <!-- 1. TAB: 训练 (Home/Plan) -->
    <section id="tab-train" class="space-y-4">
      <!-- 饮食记录环形卡片 -->
      <div class="bg-white rounded-3xl p-4 shadow-sm border border-apple-border space-y-3">
        <div class="flex justify-between items-center">
          <span class="font-bold text-sm text-black">饮食记录</span>
          <span class="text-xs text-apple-gray">0 / 2100 大卡</span>
        </div>
        <div class="grid grid-cols-4 gap-2 text-center py-1">
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full border-2 border-amber-400 flex items-center justify-center text-xs font-bold">0g</div>
            <span class="text-[10px] text-apple-gray mt-1">蛋白质</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full border-2 border-blue-400 flex items-center justify-center text-xs font-bold">0g</div>
            <span class="text-[10px] text-apple-gray mt-1">碳水</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full border-2 border-rose-400 flex items-center justify-center text-xs font-bold">0g</div>
            <span class="text-[10px] text-apple-gray mt-1">脂肪</span>
          </div>
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-full border-2 border-teal-400 flex items-center justify-center text-xs font-bold">0ml</div>
            <span class="text-[10px] text-apple-gray mt-1">饮水</span>
          </div>
        </div>
      </div>

      <!-- 计划分类标签 -->
      <div class="space-y-3">
        <div class="flex space-x-6 border-b border-apple-border pb-2 text-sm font-bold">
          <button class="text-apple-blue border-b-2 border-apple-blue pb-1">我的计划</button>
        </div>

        <div id="planContainer" class="space-y-3">
          <!-- 动态渲染计划动作 -->
        </div>
      </div>
    </section>

    <!-- 2. TAB: 动作库 (Exercise Library) -->
    <section id="tab-action" class="hidden flex gap-3 h-[75vh]">
      <!-- 左侧大部位侧边栏 -->
      <div id="catSidebar" class="w-20 bg-white rounded-2xl p-2 space-y-2 overflow-y-auto no-scrollbar shadow-sm border border-apple-border text-xs font-semibold text-center">
        <!-- 动态渲染部位分类 -->
      </div>

      <!-- 右侧动作网格区 -->
      <div class="flex-1 space-y-3 overflow-y-auto no-scrollbar">
        <div id="actionGrid" class="grid grid-cols-2 gap-2.5">
          <!-- 动态渲染动作网格 -->
        </div>
      </div>
    </section>

    <!-- 3. TAB: 挑战 (Challenges) -->
    <section id="tab-challenge" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-apple-border space-y-3">
        <h3 class="font-bold text-base text-black">连续训练打卡</h3>
        <p class="text-xs text-apple-gray">坚持打卡提升体能与肌肉塑造</p>
        <div class="flex justify-between items-center pt-2">
          <span class="text-2xl font-black text-apple-blue"><span id="streakDays">1</span> <span class="text-xs font-normal text-black">天连续</span></span>
          <button onclick="startWorkout()" class="bg-apple-blue text-white px-4 py-2 rounded-2xl text-xs font-bold shadow-md active:scale-95 transition-transform">立即打卡</button>
        </div>
      </div>
    </section>

    <!-- 4. TAB: 历史/统计 (Analytics) -->
    <section id="tab-history" class="hidden space-y-4">
      <div class="bg-white/80 p-1 rounded-2xl border border-apple-border flex text-xs font-medium text-center shadow-sm">
        <button class="flex-1 py-1.5 rounded-xl bg-apple-blue text-white font-bold shadow-sm">本周</button>
      </div>

      <div class="bg-white p-4 rounded-3xl shadow-sm border border-apple-border space-y-2">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-sm">训练容量 (kg)</h3>
          <span class="text-xs text-emerald-500 font-bold" id="totalVolumeText">0 kg</span>
        </div>
        <canvas id="appleChart" class="w-full h-40"></canvas>
      </div>
    </section>

    <!-- 5. TAB: 我的 (Profile) -->
    <section id="tab-profile" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-3xl shadow-sm border border-apple-border flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full bg-apple-blue/10 text-apple-blue font-black flex items-center justify-center text-lg">ACE</div>
          <div>
            <h3 class="font-bold text-base text-black">Ace</h3>
            <p class="text-xs text-apple-gray">训记 ID: 6360593 · <span class="text-amber-500 font-medium">永久 Pro 会员</span></p>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-3xl shadow-sm border border-apple-border divide-y divide-apple-border text-sm">
        <div onclick="alert('身体数据：体重 70kg / 体脂 15%')" class="p-3.5 flex items-center justify-between active:bg-apple-bg cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-lg bg-blue-500 text-white flex items-center justify-center"><i data-lucide="user" class="w-4 h-4"></i></div>
            <span class="font-medium">身体数据</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-apple-gray"></i>
        </div>
        <div onclick="clearData()" class="p-3.5 flex items-center justify-between active:bg-apple-bg cursor-pointer">
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rounded-lg bg-rose-500 text-white flex items-center justify-center"><i data-lucide="trash-2" class="w-4 h-4"></i></div>
            <span class="font-medium text-rose-500">重置所有数据</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-apple-gray"></i>
        </div>
      </div>
    </section>

  </main>

  <!-- 底部 iOS 悬浮毛玻璃导航栏 -->
  <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto flex items-center gap-2 z-50">
    <nav class="flex-1 apple-glass rounded-full px-3 py-2 border border-white/60 shadow-xl flex justify-around items-center text-apple-gray">
      <button onclick="switchTab('train')" id="nav-train" class="flex flex-col items-center text-apple-blue">
        <i data-lucide="clipboard-list" class="w-5 h-5"></i>
        <span class="text-[9px] mt-0.5 font-semibold">训练</span>
      </button>
      <button onclick="switchTab('challenge')" id="nav-challenge" class="flex flex-col items-center">
        <i data-lucide="star" class="w-5 h-5"></i>
        <span class="text-[9px] mt-0.5 font-semibold">挑战</span>
      </button>
      <button onclick="switchTab('action')" id="nav-action" class="flex flex-col items-center">
        <i data-lucide="activity" class="w-5 h-5"></i>
        <span class="text-[9px] mt-0.5 font-semibold">动作</span>
      </button>
      <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center">
        <i data-lucide="clock" class="w-5 h-5"></i>
        <span class="text-[9px] mt-0.5 font-semibold">历史</span>
      </button>
      <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[9px] mt-0.5 font-semibold">我的</span>
      </button>
    </nav>

    <button onclick="startWorkout()" class="w-14 h-14 rounded-full bg-apple-blue text-white shadow-xl flex flex-col items-center justify-center shrink-0 active:scale-95 transition-transform">
      <i data-lucide="play" class="w-5 h-5 fill-current"></i>
      <span class="text-[9px] font-bold mt-0.5">训练</span>
    </button>
  </div>

  <!-- JavaScript 全套交互代码 -->
  <script>
    // 动作库预设数据
    const actionDatabase = {
      '胸部': ['杠铃卧推', '哑铃卧推', '上斜杠铃卧推', '绳索夹胸', '双杠臂屈伸'],
      '背部': ['高位下拉', '杠铃划船', '单臂哑铃划船', '硬拉', '引体向上'],
      '腿部': ['杠铃深蹲', '腿举(倒蹬)', '罗马尼亚硬拉', '腿弯举'],
      '肩部': ['哑铃推举', '哑铃侧平举', '绳索面拉', '杠铃推举'],
      '手臂': ['杠铃弯举', '哑铃弯举', '绳索下压', '窄握卧推'],
      '核心': ['悬垂举腿', '卷腹', '平板支撑', '健腹轮']
    };

    let userPlans = JSON.parse(localStorage.getItem('apple_fit_plans')) || [
      { name: '杠铃卧推', cat: '胸部', sets: 4 },
      { name: '高位下拉', cat: '背部', sets: 4 }
    ];

    let currentCat = '胸部';
    let chartInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderPlans();
      renderSidebar();
      renderActionGrid('胸部');
    });

    // 1. 切换 Tab 页面
    function switchTab(tab) {
      ['train', 'challenge', 'action', 'history', 'profile'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        document.getElementById(`nav-${t}`).classList.remove('text-apple-blue');
        document.getElementById(`nav-${t}`).classList.add('text-apple-gray');
      });

      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`nav-${tab}`).classList.add('text-apple-blue');
      document.getElementById(`nav-${tab}`).classList.remove('text-apple-gray');

      if (tab === 'history') initChart();
    }

    // 2. 渲染我的计划
    function renderPlans() {
      const container = document.getElementById('planContainer');
      if (userPlans.length === 0) {
        container.innerHTML = `<p class="text-xs text-apple-gray text-center py-6">暂无动作，点击右上角【+】或去【动作】页添加</p>`;
        return;
      }

      container.innerHTML = userPlans.map((p, index) => `
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-apple-border flex justify-between items-center">
          <div>
            <span class="text-[10px] bg-apple-bg text-apple-blue px-2 py-0.5 rounded-md font-bold">${p.cat}</span>
            <h4 class="font-bold text-sm text-black mt-1">${p.name}</h4>
            <p class="text-xs text-apple-gray">目标：${p.sets} 组</p>
          </div>
          <button onclick="removePlan(${index})" class="text-apple-gray hover:text-rose-500 p-2">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // 3. 渲染动作库侧边栏
    function renderSidebar() {
      const sidebar = document.getElementById('catSidebar');
      const categories = Object.keys(actionDatabase);

      sidebar.innerHTML = categories.map(cat => `
        <button onclick="changeCat('${cat}')" class="cat-btn w-full py-2.5 rounded-xl transition-all ${cat === currentCat ? 'bg-apple-blue text-white shadow-sm' : 'text-apple-gray hover:bg-apple-bg'}">
          ${cat}
        </button>
      `).join('');
    }

    // 4. 切换部位动作网格
    function changeCat(cat) {
      currentCat = cat;
      renderSidebar();
      renderActionGrid(cat);
    }

    function renderActionGrid(cat) {
      const grid = document.getElementById('actionGrid');
      const actions = actionDatabase[cat] || [];

      grid.innerHTML = actions.map(act => `
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-apple-border flex flex-col items-center text-center space-y-2">
          <div class="w-12 h-12 rounded-xl bg-apple-bg flex items-center justify-center text-apple-blue font-bold text-sm">${cat[0]}</div>
          <span class="text-xs font-bold text-black">${act}</span>
          <button onclick="addToAction('${act}', '${cat}')" class="bg-apple-blue text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-sm active:scale-90 transition-transform">
            + 加入计划
          </button>
        </div>
      `).join('');
    }

    // 5. 动作增删
    function addToAction(name, cat) {
      userPlans.push({ name, cat, sets: 4 });
      localStorage.setItem('apple_fit_plans', JSON.stringify(userPlans));
      renderPlans();
      alert(`已成功将【${name}】加入训练计划！`);
    }

    function removePlan(index) {
      userPlans.splice(index, 1);
      localStorage.setItem('apple_fit_plans', JSON.stringify(userPlans));
      renderPlans();
    }

    function openAddModal() {
      const name = prompt('请输入新动作名称：');
      if (name) {
        addToAction(name, '自定义');
      }
    }

    function startWorkout() {
      alert('🏋️ 打卡成功！今日训练完成！');
    }

    function clearData() {
      if (confirm('确认清空所有自定义动作和打卡数据吗？')) {
        localStorage.clear();
        location.reload();
      }
    }

    // 图表初始化
    function initChart() {
      const ctx = document.getElementById('appleChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
          datasets: [{
            data: [1200, 1800, 0, 2100, 1500, 2400, 0],
            backgroundColor: '#007AFF',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { color: '#E5E5EA' } }
          }
        }
      });
    }
  </script>
</body>
</html>
